spring:
  application:
    name: captainecho

  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
      file-size-threshold: 2KB

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # SMTP 이메일 설정 (PIN 복구)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
        provider:
          google:
            redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: ${JWT_ACCESS_TOKEN_EXPIRY}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    com.captainecho.captainecho.auth.filter: info
    com.captainecho.captainecho.jwt: info
    com.captainecho.captainecho.protector: info
    com.captainecho.captainecho.student: debug
    org.springframework.security: warn

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}

# Swagger (SpringDoc OpenAPI) 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
    enabled: true
  show-actuator: true

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always

# 파일 저장 설정
file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}  # local 또는 s3
    location: ${FILE_STORAGE_LOCATION:uploads}  # 로컬 저장 경로
  upload:
    profile-images:
      path: ${FILE_UPLOAD_PROFILE_PATH:profiles}
      max-size: 5242880  # 5MB in bytes
      allowed-extensions: jpg,jpeg,png,webp

# AWS S3 설정
cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:captain-echo-files}
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    region:
      static: ${AWS_REGION:ap-northeast-2}

# AI Service 설정
ai-service:
  url: ${AI_SERVICE_URL:http://k13d101.p.ssafy.io:8000}