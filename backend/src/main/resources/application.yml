# ==============================================
# Captain Echo Spring Boot 기본 설정
# ==============================================

spring:
  application:
    name: captain-echo-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# ==============================================
# 서버 설정
# ==============================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# ==============================================
# OpenAPI (Swagger) 설정
# ==============================================
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# ==============================================
# Actuator (헬스체크 & 모니터링)
# ==============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# ==============================================
# Logging
# ==============================================
logging:
  level:
    root: INFO
    com.captainecho: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /app/logs/captain-echo.log
    max-size: 10MB
    max-history: 30

# ==============================================
# Jackson (JSON 처리)
# ==============================================
spring:
  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
