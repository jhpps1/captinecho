# ==============================================
# Captain Echo 프로덕션 환경 설정
# ==============================================

spring:
  # 데이터베이스 설정
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 60000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

# 로깅 레벨
logging:
  level:
    root: INFO
    com.captainecho: INFO
    org.hibernate.SQL: WARN

# CORS 설정 (프로덕션용)
cors:
  allowed-origins: https://captain-echo.com,https://www.captain-echo.com
  allowed-methods: GET,POST,PUT,DELETE,PATCH
  allowed-headers: "*"
  allow-credentials: true

# OpenAPI (Swagger) - 프로덕션에서는 비활성화 옵션
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
