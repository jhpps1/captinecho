# ==============================================
# 교육 플랫폼 Nginx 설정
# ==============================================
# CloudFlare와 연동하여 SSL 종료는 CloudFlare에서 처리
# Nginx는 리버스 프록시 역할

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ==============================================
    # 기본 설정
    # ==============================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 로깅 포맷
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ==============================================
    # 성능 최적화
    # ==============================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/xml+rss
        application/json;

    # ==============================================
    # CloudFlare 설정 (실제 IP 복원)
    # ==============================================
    # CloudFlare IP 범위 설정
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 2a06:98c0::/29;

    real_ip_header CF-Connecting-IP;

    # ==============================================
    # 업스트림 정의
    # ==============================================
    upstream backend_servers {
        server backend:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ai_service_servers {
        server k13d101.p.ssafy.io:8000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ==============================================
    # Rate Limiting
    # ==============================================
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=ai:10m rate=2r/s;

    # ==============================================
    # 메인 서버 블록
    # ==============================================
    server {
        listen 80;
        server_name _;

        # ==============================================
        # 보안 헤더
        # ==============================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ==============================================
        # 헬스체크 엔드포인트
        # ==============================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ==============================================
        # API 라우팅 (Spring Boot)
        # ==============================================
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # 타임아웃 설정
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # 버퍼링
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ==============================================
        # 인증 API (Rate Limiting 강화)
        # ==============================================
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
        }

        # ==============================================
        # STT API (FastAPI 서버로 라우팅)
        # ==============================================
        location /api/stt/ {
            limit_req zone=ai burst=5 nodelay;

            proxy_pass http://ai_service_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # STT 요청은 시간이 걸릴 수 있음
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ==============================================
        # AI API (별도 Rate Limiting)
        # ==============================================
        # TODO: 추가 AI API 필요시 활성화
        # location /api/ai/ {
        #     limit_req zone=ai burst=5 nodelay;
        #
        #     proxy_pass http://ai_service_servers/api/ai/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Connection "";
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header X-Forwarded-Host $server_name;
        #
        #     # AI 요청은 시간이 걸릴 수 있음
        #     proxy_connect_timeout 60s;
        #     proxy_send_timeout 300s;
        #     proxy_read_timeout 300s;
        # }

        # ==============================================
        # Spring Boot Actuator (모니터링)
        # ==============================================
        location /actuator/ {
            # 내부 네트워크에서만 접근 가능
            allow 172.20.0.0/16;
            allow 127.0.0.1;
            deny all;

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ==============================================
        # 정적 파일 (향후 프론트엔드용)
        # ==============================================
        location /static/ {
            root /usr/share/nginx/html;
            expires 1M;
            add_header Cache-Control "public, immutable";
        }

        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ==============================================
        # 기본 라우팅 (SPA 지원 - React Frontend)
        # ==============================================
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # ==============================================
        # 보안 설정 - 숨겨야 할 파일들
        # ==============================================
        location ~ /\.(git|svn|env|htaccess|htpasswd) {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ==============================================
        # 에러 페이지
        # ==============================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ==============================================
    # HTTPS 서버 블록 (CloudFlare Full SSL)
    # ==============================================
    server {
        listen 443 ssl http2;
        server_name captainecho.com www.captainecho.com;

        # SSL 인증서 (CloudFlare Origin Certificate)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HTTP/2 설정
        http2_max_field_size 64k;
        http2_max_header_size 64k;

        # 보안 헤더 (HTTPS용)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ==============================================
        # 헬스체크 엔드포인트
        # ==============================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ==============================================
        # API 라우팅 (Spring Boot)
        # ==============================================
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # 타임아웃 설정
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # 버퍼링
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ==============================================
        # 인증 API (Rate Limiting 강화)
        # ==============================================
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
        }

        # ==============================================
        # STT API (FastAPI 서버로 라우팅)
        # ==============================================
        location /api/stt/ {
            limit_req zone=ai burst=5 nodelay;

            proxy_pass http://ai_service_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # STT 요청은 시간이 걸릴 수 있음
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ==============================================
        # Spring Boot Actuator (모니터링)
        # ==============================================
        location /actuator/ {
            # 내부 네트워크에서만 접근 가능
            allow 172.20.0.0/16;
            allow 127.0.0.1;
            deny all;

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ==============================================
        # 정적 파일 (향후 프론트엔드용)
        # ==============================================
        location /static/ {
            root /usr/share/nginx/html;
            expires 1M;
            add_header Cache-Control "public, immutable";
        }

        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ==============================================
        # 기본 라우팅 (SPA 지원 - React Frontend)
        # ==============================================
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # ==============================================
        # 보안 설정 - 숨겨야 할 파일들
        # ==============================================
        location ~ /\.(git|svn|env|htaccess|htpasswd) {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ==============================================
        # 에러 페이지
        # ==============================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}